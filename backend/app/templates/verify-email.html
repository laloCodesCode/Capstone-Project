<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Email Verified — GenieMart</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --midnight: #0f2044;
                --gold: #ffb71d;
                --gold-dim: rgba(255, 183, 29, 0.12);
                --gold-glow: rgba(255, 183, 29, 0.3);
                --white: #f5f8ff;
            }

            html,
            body {
                height: 100%;
                background: var(--midnight);
                font-family: "DM Sans", sans-serif;
                color: var(--white);
                overflow: hidden;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background:
                    radial-gradient(
                        ellipse 60% 50% at 50% 0%,
                        rgba(255, 183, 29, 0.1) 0%,
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 50% 60% at 90% 90%,
                        rgba(22, 43, 88, 0.6) 0%,
                        transparent 60%
                    );
                pointer-events: none;
            }

            body::after {
                content: "";
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(
                        rgba(255, 183, 29, 0.04) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 183, 29, 0.04) 1px,
                        transparent 1px
                    );
                background-size: 48px 48px;
                pointer-events: none;
            }

            .page {
                position: relative;
                z-index: 1;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 2.5rem;
                opacity: 0;
                animation: fadeDown 0.6s ease forwards;
            }

            .logo-icon {
                width: 34px;
                height: 34px;
                background: var(--gold);
                border-radius: 9px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 17px;
            }

            .logo-text {
                font-family: "Syne", sans-serif;
                font-weight: 800;
                font-size: 1.25rem;
                letter-spacing: -0.02em;
            }

            .logo-text span {
                color: var(--gold);
            }

            .card {
                width: 100%;
                max-width: 420px;
                background: rgba(22, 43, 88, 0.5);
                border: 1px solid rgba(255, 183, 29, 0.2);
                border-radius: 24px;
                padding: 3rem 2.5rem;
                text-align: center;
                backdrop-filter: blur(16px);
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                    0 32px 64px rgba(0, 0, 0, 0.4),
                    0 0 80px var(--gold-glow);
                opacity: 0;
                animation: fadeUp 0.7s 0.2s ease forwards;
            }

            .check-wrap {
                position: relative;
                width: 80px;
                height: 80px;
                margin: 0 auto 2rem;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .check-ring {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 2px solid var(--gold);
                opacity: 0;
                animation: ringPop 0.5s 0.65s cubic-bezier(0.34, 1.56, 0.64, 1)
                    forwards;
            }

            .check-ring-outer {
                position: absolute;
                inset: -8px;
                border-radius: 50%;
                border: 1px solid rgba(255, 183, 29, 0.25);
                opacity: 0;
                animation: ringPop 0.5s 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)
                    forwards;
            }

            .check-bg {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                background: var(--gold-dim);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .check-svg {
                width: 36px;
                height: 36px;
                opacity: 0;
                animation: fadeUp 0.4s 0.9s ease forwards;
            }

            .check-svg path {
                stroke: var(--gold);
                stroke-width: 2.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                fill: none;
                stroke-dasharray: 40;
                stroke-dashoffset: 40;
                animation: drawCheck 0.5s 0.95s ease forwards;
            }

            h1 {
                font-family: "Syne", sans-serif;
                font-weight: 800;
                font-size: 1.75rem;
                letter-spacing: -0.03em;
                margin-bottom: 0.75rem;
                opacity: 0;
                animation: fadeUp 0.5s 0.7s ease forwards;
            }

            h1 span {
                color: var(--gold);
            }

            p {
                color: rgba(245, 248, 255, 0.6);
                font-size: 0.95rem;
                line-height: 1.6;
                margin-bottom: 2rem;
                opacity: 0;
                animation: fadeUp 0.5s 0.8s ease forwards;
            }

            .divider {
                width: 40px;
                height: 2px;
                background: var(--gold);
                margin: 0 auto 2rem;
                border-radius: 2px;
                opacity: 0;
                animation: fadeUp 0.5s 0.85s ease forwards;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: var(--gold-dim);
                border: 1px solid rgba(255, 183, 29, 0.3);
                border-radius: 99px;
                padding: 0.4rem 1rem;
                font-size: 0.8rem;
                font-weight: 500;
                color: var(--gold);
                opacity: 0;
                animation: fadeUp 0.5s 0.95s ease forwards;
            }

            @keyframes fadeDown {
                from {
                    opacity: 0;
                    transform: translateY(-12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes ringPop {
                from {
                    opacity: 0;
                    transform: scale(0.7);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @keyframes drawCheck {
                to {
                    stroke-dashoffset: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="logo">
                <!-- <div class="logo-icon">🛍️</div> -->
                <!-- <div class="logo-text">Genie<span>Mart</span></div> -->
            </div>

            <div class="card">
                <div class="check-wrap">
                    <div class="check-ring-outer"></div>
                    <div class="check-ring"></div>
                    <div class="check-bg">
                        <svg class="check-svg" viewBox="0 0 36 36">
                            <path d="M7 18 L15 26 L29 10" />
                        </svg>
                    </div>
                </div>

                <h1>You're <span>verified!</span></h1>
                <div class="divider"></div>
                <p>
                    Your email address has been confirmed!<br />You can now sign
                    in and start browsing GenieMart!<br />
                    <!-- Shop Local. Shop Spartan -->
                </p>
                <div class="badge">✦ &nbsp; Shop Local. Shop Spartan</div>
            </div>
        </div>
    </body>
</html>
