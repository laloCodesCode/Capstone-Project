version: "3.9"

services:
  db:
    image: postgres:16
    container_name: geniemart-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geniemart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

    #docker ps
  #docker exec -it geniemart-db psql -U postgres -d geniemart -c "\dt"
  #docker exec -it geniemart-db psql -U postgres -d geniemart -c "\d message_thread"